<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terem foglaltság</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #ffffff;
  --ink: #1e2a2f;
  --ink-soft: #5b6870;
  --line: #e3e6e8;
  --line-hour: #cdd3d6;
  --free: #f6f8f8;
  --booked: #1f6f5c;
  --booked-ink: #ffffff;
  --private: #d9dee1;
  --private-ink: #3d4a51;
  --now: #e4572e;
  --row: 26px;
  --timecol: 52px;
  --head: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --body: 'Barlow', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--body); font-size: 15px; line-height: 1.4;
  display: flex; flex-direction: column;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--now); outline-offset: 2px; }

.bar {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 16px; border-bottom: 1px solid var(--line);
}
.bar h1 {
  font-family: var(--head); font-weight: 600; font-size: 22px; letter-spacing: .01em;
  margin: 0 auto 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.nav {
  width: 36px; height: 36px; border-radius: 6px; border: 1px solid var(--line-hour);
  background: var(--paper); cursor: pointer; display: grid; place-items: center; flex: none;
}
.nav:hover { background: var(--free); }
.today {
  height: 36px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--line-hour);
  background: var(--paper); cursor: pointer; font-weight: 500;
}
.today:hover { background: var(--free); }
.full {
  display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px;
  border-radius: 6px; background: var(--booked); color: var(--booked-ink);
  font-weight: 500; text-decoration: none; white-space: nowrap; flex: none;
}
.full:hover { filter: brightness(1.12); }
.full[hidden] { display: none; }
.full svg { flex: none; }
.datepick {
  height: 36px; border: 1px solid var(--line-hour); border-radius: 6px; padding: 0 8px;
  font: inherit; color: var(--ink); background: var(--paper);
}

.rooms { display: none; gap: 10px 20px; padding: 8px 16px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; align-items: flex-end; }
.rgroup { display: flex; flex-direction: column; gap: 4px; }
.rlabel { font-size: 12px; font-weight: 500; color: var(--ink-soft); }
.rchips { display: flex; gap: 6px; }
.rooms button {
  flex: none; height: 34px; min-width: 44px; padding: 0 12px; border-radius: 17px;
  border: 1px solid var(--line-hour); background: var(--paper); cursor: pointer;
  font-family: var(--head); font-weight: 600; font-size: 16px;
}
.rooms button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.seg { display: inline-flex; border: 1px solid var(--line-hour); border-radius: 6px; padding: 2px; flex: none; }
.seg button {
  height: 30px; padding: 0 12px; border: 0; border-radius: 4px; background: none; cursor: pointer;
  font-weight: 500; color: var(--ink-soft);
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
body.show-rooms .rooms { display: flex; }
.colhead.today { color: var(--now); }
button.colhead {
  appearance: none; display: block; width: 100%; height: 100%; margin: 0; border: 0; border-radius: 0; line-height: 1.4;
  border-bottom: 1px solid var(--line-hour); cursor: pointer; font-family: var(--head); font-weight: 600;
}
button.colhead:hover { background: var(--free); }
.grid.week .colhead { font-size: 16px; }

.status { padding: 8px 16px; font-size: 14px; color: var(--ink-soft); min-height: 0; }
.status:empty { display: none; }
.status.err { color: #a3321a; }

.scroller { flex: 1; overflow: auto; position: relative; }
.grid {
  display: grid; position: relative;
  grid-template-columns: var(--timecol) repeat(var(--cols), minmax(0, 1fr));
}
.grouphead {
  position: sticky; top: 0; z-index: 3; background: var(--paper);
  height: var(--gh); line-height: var(--gh); text-align: center;
  font-size: 13px; font-weight: 500; color: var(--ink-soft);
  border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.grouphead:not(.corner) + .grouphead { border-left: 2px solid var(--line-hour); }
.colhead.loc-start, .col.loc-start { border-left: 2px solid var(--line-hour); }
.colhead {
  position: sticky; top: var(--gh, 0px); z-index: 3; background: var(--paper);
  border-bottom: 1px solid var(--line-hour);
  font-family: var(--head); font-weight: 600; font-size: 17px;
  text-align: center; padding: 8px 2px;
}
.corner { left: 0; z-index: 4; }
.times { position: relative; }
.times div {
  height: var(--row); font-family: var(--head); font-weight: 500; font-size: 13px;
  color: var(--ink-soft); text-align: right; padding-right: 8px; transform: translateY(-8px);
}
.times div.half { visibility: hidden; }
.col {
  position: relative; border-left: 1px solid var(--line);
  background-image: repeating-linear-gradient(to bottom,
    var(--line-hour) 0 1px, transparent 1px var(--row),
    var(--line) var(--row) calc(var(--row) + 1px), transparent calc(var(--row) + 1px) calc(var(--row) * 2));
}
.b {
  position: absolute; left: 3px; right: 3px; border-radius: 5px;
  padding: 3px 6px; overflow: hidden; overflow: clip; font-size: 13px; line-height: 1.25;
  text-decoration: none; display: block;
}
.b .lbl { position: sticky; top: calc(var(--gh, 0px) + var(--hh, 38px) + 3px); }
.b strong { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.b span { font-family: var(--head); font-weight: 500; opacity: .85; }
.b.pub { background: var(--booked); color: var(--booked-ink); }
a.b.pub:hover { filter: brightness(1.12); }
.b.priv {
  color: var(--private-ink);
  background: repeating-linear-gradient(135deg, var(--private) 0 6px, #e6eaec 6px 12px);
}
.b.short strong { display: inline; }
.b.short span { display: none; }
.b.tiny { padding: 0 6px; font-size: 11px; line-height: 1; }

.nowline { position: absolute; left: 0; right: 0; height: 2px; background: var(--now); z-index: 2; pointer-events: none; }
.nowline.first::before {
  content: ''; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px;
  border-radius: 50%; background: var(--now);
}

.legend {
  display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 10px 16px;
  border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-soft);
}
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; }
.legend .l-free { background: var(--free); border: 1px solid var(--line-hour); }
.legend .l-pub { background: var(--booked); }
.legend .l-priv { background: repeating-linear-gradient(135deg, var(--private) 0 4px, #e6eaec 4px 8px); }
.legend .l-now { background: var(--now); height: 3px; width: 14px; vertical-align: 3px; border-radius: 0; }

@media (max-width: 640px) {
  .grid.week { --timecol: 40px; }
  .grid.week .colhead { font-size: 14px; padding: 8px 0; }
  .grid.week .b { left: 1px; right: 1px; padding: 2px 3px; font-size: 11px; }
  .grid.week .b strong { letter-spacing: -.01em; }
  .grid.week .b span { display: none; }
  .grid.week .times div { font-size: 12px; padding-right: 4px; }
  .bar h1 { font-size: 19px; }
  .datepick { display: none; }
  .full { padding: 0; width: 36px; justify-content: center; }
  .full-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .b { font-size: 14px; }
}
@media (prefers-reduced-motion: no-preference) {
  .scroller { scroll-behavior: smooth; }
}
</style>
</head>
<body>
<header class="bar">
  <button class="nav" id="prev" aria-label="Előző nap"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
  <button class="nav" id="next" aria-label="Következő nap"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
  <h1 id="title" aria-live="polite"></h1>
  <div class="seg" role="group" aria-label="Nézet">
    <button id="vDay" aria-pressed="true">Nap</button>
    <button id="vWeek" aria-pressed="false">Hét</button>
  </div>
  <input type="date" class="datepick" id="pick" aria-label="Dátum választása">
  <button class="today" id="today">Ma</button>
  <a class="full" id="full" href="./" target="_blank" rel="noopener" hidden>
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M9 2h5v5M14 2 7.5 8.5M12 9.5V13a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="full-label">Teljes oldal</span>
  </a>
</header>
<nav class="rooms" id="rooms" aria-label="Terem választása"></nav>
<div class="status" id="status" role="status"></div>
<main class="scroller" id="scroller">
  <div class="grid" id="grid"></div>
</main>
<footer class="legend">
  <span><i class="l-free"></i>Szabad</span>
  <span><i class="l-pub"></i>Foglalt – kattints a bérlő oldaláért</span>
  <span><i class="l-priv"></i>Foglalt</span>
  <span><i class="l-now"></i>Most</span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://bzcqamsnziqnbroihjot.supabase.co';
const SUPABASE_KEY = 'sb_publishable_eaVUut5YEnXdcRz3E4ImRA_vO9TKKjx';
const TZ = 'Europe/Budapest';
const DEMO = new URLSearchParams(location.search).has('demo');
const IN_FRAME = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

const db = DEMO ? null : window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });

const $ = id => document.getElementById(id);
const partsFmt = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hourCycle: 'h23',
  year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
const hmFmt = new Intl.DateTimeFormat('hu-HU', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
const titleFmt = new Intl.DateTimeFormat('hu-HU', { timeZone: TZ, month: 'long', day: 'numeric', weekday: 'long' });

function bpParts(date) {
  const p = Object.fromEntries(partsFmt.formatToParts(date).map(x => [x.type, x.value]));
  return { y: +p.year, m: +p.month - 1, d: +p.day, h: +p.hour, min: +p.minute, s: +p.second };
}
function offsetMs(date) {
  const p = bpParts(date);
  return Date.UTC(p.y, p.m, p.d, p.h, p.min, p.s) - Math.floor(date.getTime() / 1000) * 1000;
}
function bpMidnight(y, m, d) {
  const guess = Date.UTC(y, m, d);
  let t = guess - offsetMs(new Date(guess));
  t = guess - offsetMs(new Date(t));
  return new Date(t);
}
function addDays(day, n) {
  const u = new Date(Date.UTC(day.y, day.m, day.d + n));
  return { y: u.getUTCFullYear(), m: u.getUTCMonth(), d: u.getUTCDate() };
}
const iso = day => `${day.y}-${String(day.m + 1).padStart(2, '0')}-${String(day.d).padStart(2, '0')}`;
const todayBp = () => { const p = bpParts(new Date()); return { y: p.y, m: p.m, d: p.d }; };

let rooms = [];
const URLP = new URLSearchParams(location.search);
let day = (() => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(URLP.get('nap') || ''); return m ? { y: +m[1], m: +m[2] - 1, d: +m[3] } : todayBp(); })();
let view = URLP.get('nezet') === 'het' ? 'week' : 'day';
let selectedRoom = null;
let firstRender = true;
const mobile = window.matchMedia('(max-width: 640px)');
const wdFmt = new Intl.DateTimeFormat('hu-HU', { timeZone: TZ, weekday: 'short' });
const monthDayFmt = new Intl.DateTimeFormat('hu-HU', { timeZone: TZ, month: 'long', day: 'numeric' });
const monthDayShortFmt = new Intl.DateTimeFormat('hu-HU', { timeZone: TZ, month: 'short', day: 'numeric' });
const dayShortFmt = new Intl.DateTimeFormat('hu-HU', { timeZone: TZ, month: 'short', day: 'numeric', weekday: 'short' });

function rowPx() { return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--row')); }
const isoDow = d => { const w = new Date(Date.UTC(d.y, d.m, d.d)).getUTCDay(); return w === 0 ? 7 : w; };
const weekStart = d => addDays(d, 1 - isoDow(d));
const sameDay = (a, b) => a.y === b.y && a.m === b.m && a.d === b.d;
const noon = d => new Date(bpMidnight(d.y, d.m, d.d).getTime() + 12 * 3600000);

function demoBookings(start, days) {
  const out = [];
  for (let k = 0; k < days; k++) {
    const d0 = new Date(start.getTime() + k * 86400000);
    const p = bpParts(d0); const ds = bpMidnight(p.y, p.m, p.d);
    const at = (h, m) => new Date(ds.getTime() + (h * 60 + m) * 60000).toISOString();
    const add = (t, h1, m1, h2, m2, nev, link) => out.push({ terem_id: t, kezdes: at(h1, m1), veg: at(h2, m2), nev, link });
    add(6, 0, 0, 24, 0, 'Engy-Geri', 'https://example.com');
    if (k % 7 < 5) {
      add(1, 18, 0, 19, 0, 'Foglalt', null);
      add(3, 16, 0, 19, 0, 'FittDance', 'https://example.com');
      add(5, 15, 45, 17, 30, 'Maszk', 'https://example.com');
      add(7, 15, 0, 20, 0, 'Maszk', 'https://example.com');
    }
    if (k % 2 === 0) { add(1, 8, 15, 9, 15, 'Alizetics', 'https://example.com'); add(3, 19, 0, 21, 0, 'Onyx', 'https://example.com'); }
    if (k % 7 === 5) { add(1, 8, 45, 11, 0, 'Foglalt', null); add(5, 14, 0, 17, 0, 'FamDance', 'https://example.com'); }
    if (k % 3 === 1) add(4, 18, 0, 19, 30, 'Justitia', 'https://example.com');
  }
  return out;
}

async function loadRooms() {
  if (DEMO) { rooms = [1,2,3,4,5,6,7].map(i => ({ id: i, nev: 'Terem ' + i, sorrend: i, helyszin: i < 5 ? 'Mikepércsi út 10' : 'Déli sor 29' })); return; }
  const { data, error } = await db.from('termek').select('*').order('sorrend');
  if (error) throw error;
  rooms = data;
}

async function loadBookings(start, end) {
  if (DEMO) return demoBookings(start, Math.round((end - start) / 86400000));
  const { data, error } = await db.rpc('naptar', { tol: start.toISOString(), ig: end.toISOString() });
  if (error) throw error;
  return data;
}

function renderRoomChips() {
  const nav = $('rooms');
  nav.innerHTML = '';
  let chips = null;
  rooms.forEach((r, i) => {
    if (i === 0 || r.helyszin !== rooms[i - 1].helyszin) {
      const g = document.createElement('div'); g.className = 'rgroup';
      const l = document.createElement('span'); l.className = 'rlabel';
      l.textContent = r.helyszin ? 'Termek: ' + r.helyszin : 'Termek';
      chips = document.createElement('div'); chips.className = 'rchips';
      g.append(l, chips); nav.appendChild(g);
    }
    const b = document.createElement('button');
    b.textContent = mobile.matches ? (r.nev.replace(/^Terem\s*/i, '') || r.nev) : r.nev;
    b.setAttribute('aria-label', r.nev + (r.helyszin ? ', ' + r.helyszin : ''));
    if (r.helyszin) b.title = r.helyszin;
    b.setAttribute('aria-pressed', String(r.id === selectedRoom));
    b.onclick = () => { selectedRoom = r.id; renderRoomChips(); refresh(); };
    chips.appendChild(b);
  });
}

function setView(v) {
  view = v;
  $('vDay').setAttribute('aria-pressed', String(v === 'day'));
  $('vWeek').setAttribute('aria-pressed', String(v === 'week'));
  $('prev').setAttribute('aria-label', v === 'day' ? 'Előző nap' : 'Előző hét');
  $('next').setAttribute('aria-label', v === 'day' ? 'Következő nap' : 'Következő hét');
  refresh();
}
$('vDay').onclick = () => setView('day');
$('vWeek').onclick = () => setView('week');

/* local-clock minutes of t within the given local day, clamped to 0..1440 */
function minutesIn(t, d, ds, de) {
  if (t <= ds) return 0;
  if (t >= de) return 1440;
  const p = bpParts(t);
  return p.h * 60 + p.min;
}

/* cols: [{ label, title?, onClick?, today, locStart, d, ds, de, bookings }] ; groups: [{ label, span }] */
function build(cols, groups) {
  const grid = $('grid');
  grid.classList.toggle('week', view === 'week');
  grid.style.setProperty('--cols', cols.length);
  grid.innerHTML = '';
  const row = rowPx();
  const slots = 48;

  const hasGroups = groups.some(g => g.label);
  grid.style.setProperty('--gh', hasGroups ? '28px' : '0px');
  if (hasGroups) {
    const gc = document.createElement('div'); gc.className = 'grouphead corner'; grid.appendChild(gc);
    groups.forEach(g => {
      const el = document.createElement('div');
      el.className = 'grouphead';
      el.style.gridColumn = 'span ' + g.span;
      el.textContent = g.label || '';
      grid.appendChild(el);
    });
  }
  const corner = document.createElement('div'); corner.className = 'colhead corner'; grid.appendChild(corner);
  cols.forEach(c => {
    const h = document.createElement(c.onClick ? 'button' : 'div');
    h.className = 'colhead' + (c.locStart ? ' loc-start' : '') + (c.today && view === 'week' ? ' today' : '');
    h.textContent = c.label;
    if (c.title) h.title = c.title;
    if (c.onClick) { h.type = 'button'; h.onclick = c.onClick; }
    grid.appendChild(h);
  });
  grid.style.setProperty('--hh', grid.querySelector('.colhead:not(.corner)').offsetHeight + 'px');

  const times = document.createElement('div');
  times.className = 'times';
  for (let i = 0; i < slots; i++) {
    const t = document.createElement('div');
    t.textContent = i === 0 ? '' : `${String(Math.floor(i / 2)).padStart(2, '0')}:${i % 2 ? '30' : '00'}`;
    if (i % 2) t.className = 'half';
    times.appendChild(t);
  }
  grid.appendChild(times);

  const now = new Date();
  let firstNow = true;
  cols.forEach(c => {
    const col = document.createElement('div');
    col.className = 'col' + (c.locStart ? ' loc-start' : '');
    col.style.height = (slots * row) + 'px';
    col.setAttribute('role', 'list');
    col.setAttribute('aria-label', (c.title || c.label) + ' foglalásai');
    c.bookings.forEach(b => {
      const k = new Date(b.kezdes), v = new Date(b.veg);
      if (v <= c.ds || k >= c.de) return;
      const s = minutesIn(k, c.d, c.ds, c.de);
      const e = minutesIn(v, c.d, c.ds, c.de);
      if (e <= s) return;
      const el = document.createElement(b.link ? 'a' : 'div');
      el.className = 'b ' + (b.link || b.nev !== 'Foglalt' ? 'pub' : 'priv');
      if ((e - s) <= 30) el.classList.add('short');
      if ((e - s) < 30) el.classList.add('tiny');
      el.style.top = (s / 30 * row + 1) + 'px';
      el.style.height = ((e - s) / 30 * row - 2) + 'px';
      el.setAttribute('role', 'listitem');
      const range = (s === 0 && e === 1440) ? 'Egész nap' : hmFmt.format(k) + '–' + hmFmt.format(v);
      el.innerHTML = '<div class="lbl"><strong></strong><span></span></div>';
      el.querySelector('strong').textContent = b.nev;
      el.querySelector('span').textContent = range;
      el.title = b.nev + ', ' + range;
      if (b.link) {
        el.href = b.link;
        // Wix-kereten belül új lapot a Safari letilt (Cross-Origin-Opener-Policy),
        // ezért ott a teljes oldal helyén nyitjuk meg. Önállóan új lapon.
        el.target = IN_FRAME ? '_top' : '_blank';
        el.rel = 'noopener';
      }
      col.appendChild(el);
    });
    if (now >= c.ds && now < c.de) {
      const line = document.createElement('div');
      line.className = 'nowline' + (firstNow ? ' first' : '');
      firstNow = false;
      const p = bpParts(now);
      line.style.top = ((p.h * 60 + p.min) / 30 * row - 1) + 'px';
      col.appendChild(line);
    }
    grid.appendChild(col);
  });
  return { row };
}

function dayCols(bookings, d) {
  const ds = bpMidnight(d.y, d.m, d.d), nd = addDays(d, 1), de = bpMidnight(nd.y, nd.m, nd.d);
  const today = sameDay(d, todayBp());
  const visible = mobile.matches ? rooms.filter(r => r.id === selectedRoom) : rooms;
  const cols = visible.map((r, i) => ({
    label: r.nev, title: r.nev + (r.helyszin ? ', ' + r.helyszin : ''), today,
    locStart: i > 0 && r.helyszin !== visible[i - 1].helyszin,
    d, ds, de, bookings: bookings.filter(b => b.terem_id === r.id),
  }));
  const groups = [];
  visible.forEach((r, i) => {
    if (i > 0 && r.helyszin === visible[i - 1].helyszin) groups[groups.length - 1].span++;
    else groups.push({ label: r.helyszin, span: 1 });
  });
  return { cols, groups };
}

function weekCols(bookings, ws) {
  const room = rooms.find(r => r.id === selectedRoom) || rooms[0];
  const tday = todayBp();
  const cols = [];
  for (let k = 0; k < 7; k++) {
    const d = addDays(ws, k);
    const ds = bpMidnight(d.y, d.m, d.d), nd = addDays(d, 1), de = bpMidnight(nd.y, nd.m, nd.d);
    const wd = wdFmt.format(noon(d)).replace('.', '');
    cols.push({
      label: `${wd.charAt(0).toUpperCase() + wd.slice(1)} ${d.d}.`,
      title: titleFmt.format(noon(d)) + ' – megnyitás napi nézetben',
      today: sameDay(d, tday),
      onClick: () => { day = d; setView('day'); },
      d, ds, de, bookings: bookings.filter(b => b.terem_id === room.id),
    });
  }
  const label = room.nev + (room.helyszin ? ', ' + room.helyszin : '');
  return { cols, groups: [{ label, span: 7 }] };
}

function weekTitle(ws) {
  const we = addDays(ws, 6);
  const f = mobile.matches ? monthDayShortFmt : monthDayFmt;
  const first = f.format(noon(ws)).replace(/\.$/, '');
  if (ws.m === we.m) return `${first}–${we.d}.`;
  return `${first} – ${f.format(noon(we))}`;
}

let reqId = 0;
async function refresh() {
  const my = ++reqId;
  document.body.classList.toggle('show-rooms', view === 'week' || mobile.matches);
  let start, end, ws;
  if (view === 'day') {
    start = bpMidnight(day.y, day.m, day.d);
    const nd = addDays(day, 1); end = bpMidnight(nd.y, nd.m, nd.d);
    $('title').textContent = (mobile.matches ? dayShortFmt : titleFmt).format(noon(day));
  } else {
    ws = weekStart(day);
    start = bpMidnight(ws.y, ws.m, ws.d);
    const we = addDays(ws, 7); end = bpMidnight(we.y, we.m, we.d);
    $('title').textContent = weekTitle(ws);
  }
  $('pick').value = iso(day);
  if (IN_FRAME) {
    const q = new URLSearchParams({ nap: iso(day), nezet: view === 'week' ? 'het' : 'nap' });
    if (selectedRoom) q.set('terem', selectedRoom);
    if (DEMO) q.set('demo', '1');
    $('full').href = location.pathname + '?' + q.toString();
    $('full').hidden = false;
  }
  try {
    const bookings = await loadBookings(start, end);
    if (my !== reqId) return;
    $('status').textContent = '';
    $('status').className = 'status';
    const { cols, groups } = view === 'day' ? dayCols(bookings, day) : weekCols(bookings, ws);
    const { row } = build(cols, groups);
    if (firstRender) {
      firstRender = false;
      const p = bpParts(new Date());
      const target = sameDay(day, todayBp()) ? p.h * 60 + p.min - 60 : 7 * 60;
      $('scroller').style.scrollBehavior = 'auto';
      $('scroller').scrollTop = Math.max(0, target / 30 * row);
      $('scroller').style.scrollBehavior = '';
    }
  } catch (err) {
    if (my !== reqId) return;
    console.error(err);
    $('status').className = 'status err';
    $('status').textContent = 'Nem sikerült betölteni a naptárt. Ellenőrizd az internetkapcsolatot, és frissítsd az oldalt.';
  }
}

function go(n) { day = addDays(day, view === 'day' ? n : 7 * n); refresh(); }
$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
$('today').onclick = () => { day = todayBp(); firstRender = true; refresh(); };
$('pick').onchange = e => {
  const [y, m, d] = e.target.value.split('-').map(Number);
  if (y) { day = { y, m: m - 1, d }; refresh(); }
};
mobile.addEventListener('change', () => { renderRoomChips(); refresh(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
setInterval(() => { if (!document.hidden) refresh(); }, 60000);

(async () => {
  try {
    await loadRooms();
    const wanted = +URLP.get('terem');
    selectedRoom = rooms.some(r => r.id === wanted) ? wanted : (rooms[0] && rooms[0].id);
    if (view === 'week') { $('vDay').setAttribute('aria-pressed', 'false'); $('vWeek').setAttribute('aria-pressed', 'true'); $('prev').setAttribute('aria-label', 'Előző hét'); $('next').setAttribute('aria-label', 'Következő hét'); }
    renderRoomChips();
    refresh();
  } catch (err) {
    console.error(err);
    $('status').className = 'status err';
    $('status').textContent = 'Nem sikerült betölteni a termeket. Frissítsd az oldalt.';
  }
})();
</script>

<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Foglalások kezelése</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #ffffff;
  --ink: #1e2a2f;
  --ink-soft: #5b6870;
  --line: #e3e6e8;
  --line-hour: #cdd3d6;
  --free: #f6f8f8;
  --booked: #1f6f5c;
  --booked-ink: #ffffff;
  --private: #d9dee1;
  --private-ink: #3d4a51;
  --now: #e4572e;
  --danger: #a3321a;
  --row: 26px;
  --timecol: 52px;
  --head: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --body: 'Barlow', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--body); font-size: 15px; line-height: 1.4;
  display: flex; flex-direction: column;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--now); outline-offset: 2px; }
[hidden] { display: none !important; }

.btn {
  height: 36px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--line-hour);
  background: var(--paper); cursor: pointer; font-weight: 500; white-space: nowrap;
}
.btn:hover { background: var(--free); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.primary:hover { background: #2f3f46; }
.btn.danger { color: var(--danger); border-color: #e5b9ae; }
.btn.danger:hover { background: #fbf0ed; }
.btn.icon { width: 36px; padding: 0; display: grid; place-items: center; }

/* Login */
.login { margin: auto; width: min(360px, calc(100% - 32px)); padding: 32px 0; }
.login h1 { font-family: var(--head); font-weight: 600; font-size: 28px; margin: 0 0 20px; }

label.f { display: block; margin-bottom: 14px; }
label.f > span { display: block; font-size: 14px; font-weight: 500; margin-bottom: 4px; }
label.f small { display: block; color: var(--ink-soft); font-size: 13px; margin-top: 3px; }
.in {
  width: 100%; height: 38px; border: 1px solid var(--line-hour); border-radius: 6px;
  padding: 0 10px; background: var(--paper);
}
textarea.in { height: 64px; padding: 8px 10px; resize: vertical; }
.check { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-weight: 500; }
.check input { width: 18px; height: 18px; accent-color: var(--ink); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.err { color: var(--danger); font-size: 14px; margin: 0 0 12px; }
.err:empty { display: none; }

/* App bar */
.bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 12px 16px; border-bottom: 1px solid var(--line);
}
.tabs { display: flex; gap: 4px; margin-right: 8px; }
.tabs button {
  height: 36px; padding: 0 14px; border: 0; border-radius: 6px; background: none; cursor: pointer;
  font-family: var(--head); font-weight: 600; font-size: 18px; color: var(--ink-soft);
}
.tabs button[aria-selected="true"] { background: var(--free); color: var(--ink); }
.bar h1 {
  font-family: var(--head); font-weight: 600; font-size: 22px;
  margin: 0 auto 0 4px; white-space: nowrap;
}
.spacer { margin-left: auto; }
.sync {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--ink-soft);
}
.sync strong { color: var(--ink); font-weight: 500; }
.sync .btn { height: 32px; }
.sync .warn { color: var(--danger); }
.b.gcal::before {
  content: 'G'; position: absolute; right: 5px; top: 2px; font-size: 11px; font-weight: 600; opacity: .8;
}
.hint { padding: 8px 16px; font-size: 14px; color: var(--ink-soft); border-bottom: 1px solid var(--line); }

.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
  background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 6px;
  font-size: 14px; z-index: 20; max-width: calc(100% - 32px);
}
.toast.bad { background: var(--danger); }

/* Calendar */
.scroller { flex: 1; overflow: auto; position: relative; }
.grid { display: grid; position: relative; grid-template-columns: var(--timecol) repeat(var(--cols, 7), minmax(var(--colmin, 110px), 1fr)); }
.grid.week { --colmin: 0px; }
.grouphead {
  position: sticky; top: 0; z-index: 3; background: var(--paper);
  height: var(--gh); line-height: var(--gh); text-align: center;
  font-size: 13px; font-weight: 500; color: var(--ink-soft);
  border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.grouphead.corner { left: 0; z-index: 4; }
.grouphead:not(.corner) + .grouphead { border-left: 2px solid var(--line-hour); }
.colhead.loc-start, .col.loc-start { border-left: 2px solid var(--line-hour); }
.colhead.today { color: var(--now); }
button.colhead {
  appearance: none; display: block; width: 100%; height: 100%; margin: 0; border: 0; border-radius: 0;
  border-bottom: 1px solid var(--line-hour); cursor: pointer; line-height: 1.4;
}
button.colhead:hover { background: var(--free); }
.colhead {
  position: sticky; top: var(--gh, 0px); z-index: 3; background: var(--paper);
  border-bottom: 1px solid var(--line-hour);
  font-family: var(--head); font-weight: 600; font-size: 17px; text-align: center; padding: 8px 2px;
}
.corner { left: 0; z-index: 4; }
.times { position: sticky; left: 0; z-index: 2; background: var(--paper); }
.times div {
  height: var(--row); font-family: var(--head); font-weight: 500; font-size: 13px;
  color: var(--ink-soft); text-align: right; padding-right: 8px; transform: translateY(-8px);
}
.times div.half { visibility: hidden; }
.col {
  position: relative; border-left: 1px solid var(--line); cursor: cell;
  background-image: repeating-linear-gradient(to bottom,
    var(--line-hour) 0 1px, transparent 1px var(--row),
    var(--line) var(--row) calc(var(--row) + 1px), transparent calc(var(--row) + 1px) calc(var(--row) * 2));
}
.ghost {
  position: absolute; left: 3px; right: 3px; height: calc(var(--row) - 2px);
  border: 1.5px dashed var(--ink-soft); border-radius: 5px; pointer-events: none;
  font-size: 12px; color: var(--ink-soft); padding: 2px 6px; font-family: var(--head);
}
.b {
  position: absolute; left: 3px; right: 3px; border-radius: 5px; border: 0; text-align: left;
  padding: 3px 6px; overflow: hidden; overflow: clip; font-size: 13px; line-height: 1.25; cursor: pointer;
}
.b { display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; }
.b .lbl { position: sticky; top: calc(var(--gh, 0px) + var(--hh, 38px) + 3px); }
.b strong { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.b span { font-family: var(--head); font-weight: 500; opacity: .85; }
.b.pub { background: var(--booked); color: var(--booked-ink); }
.b.priv { color: var(--private-ink); background: repeating-linear-gradient(135deg, var(--private) 0 6px, #e6eaec 6px 12px); }
.b.series::after {
  content: '↻'; position: absolute; right: 5px; top: 2px; font-size: 13px; opacity: .8;
}
.b:hover { filter: brightness(1.08); }
.b.short span { display: none; }
.b.tiny { padding: 0 6px; font-size: 11px; line-height: 1; }
.nowline { position: absolute; left: 0; right: 0; height: 2px; background: var(--now); z-index: 1; pointer-events: none; }

/* View switch + room chips */
.seg { display: inline-flex; border: 1px solid var(--line-hour); border-radius: 6px; padding: 2px; flex: none; }
.seg button {
  height: 30px; padding: 0 12px; border: 0; border-radius: 4px; background: none; cursor: pointer;
  font-weight: 500; color: var(--ink-soft);
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.rooms { display: none; gap: 10px 20px; padding: 8px 16px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; align-items: flex-end; }
body.show-rooms .rooms { display: flex; }
.rgroup { display: flex; flex-direction: column; gap: 4px; }
.rlabel { font-size: 12px; font-weight: 500; color: var(--ink-soft); }
.rchips { display: flex; gap: 6px; }
.rchips button {
  flex: none; height: 34px; min-width: 44px; padding: 0 12px; border-radius: 17px;
  border: 1px solid var(--line-hour); background: var(--paper); cursor: pointer;
  font-family: var(--head); font-weight: 600; font-size: 16px;
}
.rchips button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* Tenants */
.tenants { flex: 1; overflow: auto; padding: 16px; }
.tenants .top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; max-width: 900px; }
.tenants .top .in { max-width: 280px; }
table.t { border-collapse: collapse; width: 100%; max-width: 900px; font-size: 14px; }
table.t th { text-align: left; font-weight: 500; color: var(--ink-soft); padding: 8px; border-bottom: 1px solid var(--line-hour); }
table.t td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t tr:hover td { background: var(--free); cursor: pointer; }
.pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--free); color: var(--ink-soft); border: 1px solid var(--line); }
.pill.on { background: #e3f1ec; color: #155244; border-color: #bcdcd1; }
.empty { color: var(--ink-soft); padding: 24px 8px; }

/* Dialog */
dialog {
  border: 0; border-radius: 10px; padding: 0; width: min(440px, calc(100% - 24px));
  box-shadow: 0 12px 40px rgba(30, 42, 47, .25);
}
dialog::backdrop { background: rgba(30, 42, 47, .45); }
dialog form { padding: 20px; }
dialog h2 { font-family: var(--head); font-weight: 600; font-size: 22px; margin: 0 0 16px; }
.meta { font-size: 14px; color: var(--ink-soft); margin: -8px 0 16px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-top: 8px; }
.actions .left { margin-right: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.repeat { border: 1px solid var(--line); border-radius: 8px; padding: 12px 12px 0; margin-bottom: 14px; }

@media (max-width: 640px) {
  .bar h1 { font-size: 18px; order: 5; width: 100%; margin: 4px 0 0; }
  #pick { display: none; }
  .hint { display: none; }
  .grid.week { --timecol: 40px; }
  .grid.week .colhead { font-size: 14px; padding: 8px 0; }
  .grid.week .b { left: 1px; right: 1px; padding: 2px 3px; font-size: 11px; }
  .grid.week .b span { display: none; }
  .grid.week .b.series::after, .grid.week .b.gcal::before { display: none; }
  .grid.week .times div { font-size: 12px; padding-right: 4px; }
  .row2 { grid-template-columns: 1fr; gap: 0; }
}
</style>
</head>
<body>

<section class="login" id="loginView" hidden>
  <h1>Foglalások kezelése</h1>
  <form id="loginForm">
    <label class="f"><span>E-mail cím</span><input class="in" type="email" id="email" autocomplete="username" required></label>
    <label class="f"><span>Jelszó</span><input class="in" type="password" id="password" autocomplete="current-password" required></label>
    <p class="err" id="loginErr"></p>
    <button class="btn primary" type="submit" style="width:100%">Belépés</button>
  </form>
</section>

<div id="appView" hidden style="display:contents">
  <header class="bar">
    <div class="tabs" role="tablist">
      <button role="tab" id="tabCal" aria-selected="true">Naptár</button>
      <button role="tab" id="tabTen" aria-selected="false">Bérlők</button>
    </div>
    <span id="calNav" style="display:contents">
      <button class="btn icon" id="prev" aria-label="Előző nap"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
      <button class="btn icon" id="next" aria-label="Következő nap"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
      <h1 id="title"></h1>
      <div class="seg" role="group" aria-label="Nézet">
        <button id="vDay" aria-pressed="true">Nap</button>
        <button id="vWeek" aria-pressed="false">Hét</button>
      </div>
      <input type="date" class="in" id="pick" style="width:auto" aria-label="Dátum választása">
      <button class="btn" id="today">Ma</button>
    </span>
    <span class="spacer" id="tenSpacer" hidden></span>
    <button class="btn" id="logout">Kilépés</button>
  </header>

  <section id="calView" style="display:contents">
    <nav class="rooms" id="rooms" aria-label="Terem választása"></nav>
    <div class="sync" id="syncBar">
      <span id="syncInfo">Maszk Google-naptár: betöltés…</span>
      <button class="btn" id="syncNow">Szinkronizálás most</button>
    </div>
    <div class="hint">Új foglaláshoz kattints egy üres sávra. Meglévő foglalás szerkesztéséhez kattints rá. A ↻ jel ismétlődő sorozatot, a G a Maszk Google-naptárából jött alkalmat jelöl.</div>
    <main class="scroller" id="scroller"><div class="grid" id="grid"></div></main>
  </section>

  <section class="tenants" id="tenView" hidden>
    <div class="top">
      <input class="in" type="search" id="tenSearch" placeholder="Keresés név szerint" aria-label="Bérlő keresése">
      <button class="btn primary" id="newTenant">Új bérlő</button>
    </div>
    <table class="t">
      <thead><tr><th>Név</th><th>A naptárban így látszik</th><th>Elérhetőség</th></tr></thead>
      <tbody id="tenRows"></tbody>
    </table>
  </section>
</div>

<!-- Booking dialog -->
<dialog id="bDlg">
  <form method="dialog" id="bForm">
    <h2 id="bTitle">Új foglalás</h2>
    <p class="meta" id="bMeta" hidden></p>
    <label class="f"><span>Terem</span><select class="in" id="bRoom"></select></label>
    <div class="row2">
      <label class="f"><span>Nap</span><input class="in" type="date" id="bDate" required></label>
      <label class="f"><span>Kezdés</span><select class="in" id="bStart"></select></label>
    </div>
    <label class="f"><span>Időtartam</span><select class="in" id="bDur"></select></label>
    <label class="f"><span>Bérlő</span>
      <select class="in" id="bTenant"></select>
      <small><a href="#" id="bNewTenant">Új bérlő felvétele</a></small>
    </label>
    <label class="f"><span>Megjegyzés</span><textarea class="in" id="bNote" placeholder="Csak te látod"></textarea></label>
    <div id="bRepeatWrap">
      <label class="check"><input type="checkbox" id="bRepeat"> Ismétlés hetente</label>
      <div class="repeat" id="bRepeatBox" hidden>
        <label class="f"><span>Utolsó alkalom legkésőbb</span><input class="in" type="date" id="bUntil">
          <small id="bRepeatInfo"></small></label>
      </div>
    </div>
    <p class="err" id="bErr"></p>
    <div class="actions">
      <span class="left" id="bDelWrap" hidden>
        <button type="button" class="btn danger" id="bDelOne">Törlés</button>
        <button type="button" class="btn danger" id="bDelSeries" hidden>Ezt és a későbbieket törlöm</button>
      </span>
      <button type="button" class="btn" id="bCancel">Mégse</button>
      <button type="submit" class="btn primary" id="bSave">Mentés</button>
    </div>
  </form>
</dialog>

<!-- Tenant dialog -->
<dialog id="tDlg">
  <form method="dialog" id="tForm">
    <h2 id="tTitle">Új bérlő</h2>
    <label class="f"><span>Név</span><input class="in" id="tName" required><small>Ahogy te ismered, pl. „Kiss Anna – jóga”</small></label>
    <label class="check"><input type="checkbox" id="tPublic"> Név és link látszódjon a nyilvános naptárban</label>
    <div id="tPubBox">
      <label class="f"><span>Megjelenő név</span><input class="in" id="tDisplay"><small>Ha üres, a fenti név jelenik meg</small></label>
      <label class="f"><span>Link (weboldal vagy Facebook)</span><input class="in" type="text" inputmode="url" autocomplete="url" id="tLink" placeholder="https://facebook.com/…"></label>
    </div>
    <label class="f"><span>Elérhetőség</span><input class="in" id="tContact" placeholder="Telefon vagy e-mail"><small>Csak te látod</small></label>
    <label class="f"><span>Megjegyzés</span><textarea class="in" id="tNote" placeholder="Csak te látod"></textarea></label>
    <p class="err" id="tErr"></p>
    <div class="actions">
      <button type="button" class="btn" id="tCancel">Mégse</button>
      <button type="submit" class="btn primary">Mentés</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" hidden role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://bzcqamsnziqnbroihjot.supabase.co';
const SUPABASE_KEY = 'sb_publishable_eaVUut5YEnXdcRz3E4ImRA_vO9TKKjx';
const TZ = 'Europe/Budapest';
const DEMO = new URLSearchParams(location.search).has('demo');
const $ = id => document.getElementById(id);

/* ---------- Time helpers (Budapest) ---------- */
const partsFmt = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hourCycle: 'h23',
  year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
const hmFmt = new Intl.DateTimeFormat('hu-HU', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
const titleFmt = new Intl.DateTimeFormat('hu-HU', { timeZone: TZ, year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
const shortDateFmt = new Intl.DateTimeFormat('hu-HU', { timeZone: TZ, month: 'long', day: 'numeric', weekday: 'short' });
function bpParts(date) {
  const p = Object.fromEntries(partsFmt.formatToParts(date).map(x => [x.type, x.value]));
  return { y: +p.year, m: +p.month - 1, d: +p.day, h: +p.hour, min: +p.minute, s: +p.second };
}
function offsetMs(date) {
  const p = bpParts(date);
  return Date.UTC(p.y, p.m, p.d, p.h, p.min, p.s) - Math.floor(date.getTime() / 1000) * 1000;
}
function bpTime(y, m, d, h = 0, min = 0) {
  const guess = Date.UTC(y, m, d, h, min);
  let t = guess - offsetMs(new Date(guess));
  t = guess - offsetMs(new Date(t));
  return new Date(t);
}
function addDays(day, n) {
  const u = new Date(Date.UTC(day.y, day.m, day.d + n));
  return { y: u.getUTCFullYear(), m: u.getUTCMonth(), d: u.getUTCDate() };
}
const iso = day => `${day.y}-${String(day.m + 1).padStart(2, '0')}-${String(day.d).padStart(2, '0')}`;
const parseIso = s => { const [y, m, d] = s.split('-').map(Number); return { y, m: m - 1, d }; };
const todayBp = () => { const p = bpParts(new Date()); return { y: p.y, m: p.m, d: p.d }; };
const hm = mins => `${String(Math.floor(mins / 60)).padStart(2, '0')}:${String(mins % 60).padStart(2, '0')}`;
const isoDow = day => { const w = new Date(Date.UTC(day.y, day.m, day.d)).getUTCDay(); return w === 0 ? 7 : w; };
const DOW = ['', 'hétfő', 'kedd', 'szerda', 'csütörtök', 'péntek', 'szombat', 'vasárnap'];
function durLabel(m) {
  const h = Math.floor(m / 60), r = m % 60;
  return (h ? h + ' óra' : '') + (h && r ? ' ' : '') + (r ? r + ' perc' : '');
}

/* ---------- Data layer ---------- */
function friendlyError(err) {
  const msg = (err && (err.message || err.error_description)) || String(err);
  if (err && err.code === '23P01') return 'Ütközik egy meglévő foglalással ugyanebben a teremben.';
  if (/foglalas_veg_kezdes_utan/.test(msg)) return 'A foglalás vége a kezdés után kell legyen.';
  if (/felora|negyedora/.test(msg)) return 'Csak negyedórára (:00, :15, :30, :45) lehet foglalni.';
  if (/Invalid login credentials/i.test(msg)) return 'Hibás e-mail cím vagy jelszó.';
  if (/Failed to fetch|NetworkError/i.test(msg)) return 'Nincs kapcsolat a szerverrel. Ellenőrizd az internetet.';
  if (/^Ütközés:/.test(msg)) return msg + '. Semmi nem lett elmentve, válassz másik időpontot vagy rövidebb időszakot.';
  if (/Nincs jogosultság/.test(msg)) return 'Ehhez a fiókhoz nincs admin jog.';
  return msg;
}

let api;
if (!DEMO) {
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const chk = ({ data, error }) => { if (error) throw error; return data; };
  api = {
    async session() { return (await db.auth.getSession()).data.session; },
    async login(email, password) { chk(await db.auth.signInWithPassword({ email, password })); },
    async logout() { await db.auth.signOut(); },
    async isAdmin() { const d = chk(await db.from('adminok').select('user_id')); return d.length > 0; },
    async lastSync() {
      const d = chk(await db.from('szinkron_naplo').select('*').order('futott', { ascending: false }).limit(1));
      return d[0] || null;
    },
    async syncNow() {
      const s = (await db.auth.getSession()).data.session;
      if (!s) throw new Error('Lejárt bejelentkezés. Lépj ki és be újra.');
      const r = await fetch('/api/szinkron', { method: 'POST', headers: { Authorization: 'Bearer ' + s.access_token } });
      let j = {}; try { j = await r.json(); } catch (e) {}
      if (!r.ok) throw new Error(j.hiba || ('A szinkron nem futott le (HTTP ' + r.status + ').'));
      return j;
    },
    async rooms() { return chk(await db.from('termek').select('*').order('sorrend')); },
    async tenants() { return chk(await db.from('berlok').select('*').order('nev')); },
    async bookings(start, end) {
      return chk(await db.from('foglalasok').select('*')
        .lt('kezdes', end.toISOString()).gt('veg', start.toISOString()).order('kezdes'));
    },
    async addBooking(b) { chk(await db.from('foglalasok').insert(b)); },
    async updateBooking(id, b) { chk(await db.from('foglalasok').update(b).eq('id', id)); },
    async deleteBooking(id) { chk(await db.from('foglalasok').delete().eq('id', id)); },
    async deleteSeriesFrom(seriesId, fromIso) {
      chk(await db.from('foglalasok').delete().eq('sorozat_id', seriesId).gte('kezdes', fromIso));
    },
    async addSeries(p) { return chk(await db.rpc('sorozat_letrehozasa', p)); },
    async saveTenant(id, t) {
      if (id) return chk(await db.from('berlok').update(t).eq('id', id).select().single());
      return chk(await db.from('berlok').insert(t).select().single());
    },
  };
} else {
  /* Próbaüzem helyi adatokkal: admin.html?demo=1 */
  const mem = { tenants: [], bookings: [], seq: 1, sseq: 1 };
  const t0 = todayBp();
  const at = (dd, h, mi) => { const d = addDays(t0, dd); return bpTime(d.y, d.m, d.d, h, mi).toISOString(); };
  mem.tenants = [
    { id: 1, nev: 'Kiss Anna – jóga', megjeleno_nev: 'Jóga Stúdió', link: 'https://example.com', nyilvanos: true, elerhetoseg: '+36 30 123 4567', megjegyzes: null },
    { id: 2, nev: 'Nagy Béla', megjeleno_nev: null, link: null, nyilvanos: false, elerhetoseg: 'bela@pelda.hu', megjegyzes: 'Csak hétvégén' },
  ];
  mem.bookings = [
    { id: mem.seq++, terem_id: 1, berlo_id: 1, kezdes: at(0, 17, 0), veg: at(0, 19, 0), sorozat_id: null, megjegyzes: null },
    { id: mem.seq++, terem_id: 3, berlo_id: 2, kezdes: at(0, 18, 0), veg: at(0, 19, 30), sorozat_id: null, megjegyzes: 'Kulcsot kér' },
    { id: mem.seq++, terem_id: 7, berlo_id: 1, kezdes: at(0, 10, 0), veg: at(0, 12, 15), sorozat_id: null, megjegyzes: 'Galambok – próba', forras: 'gcal-maszk' },
  ];
  const overlap = (b, ex) => mem.bookings.some(o => o.id !== ex && o.terem_id === b.terem_id &&
    new Date(o.kezdes) < new Date(b.veg) && new Date(o.veg) > new Date(b.kezdes));
  const conflictErr = () => Object.assign(new Error('conflicting key value violates exclusion constraint'), { code: '23P01' });
  const wait = () => new Promise(r => setTimeout(r, 120));
  let logged = false;
  api = {
    async session() { return logged ? {} : null; },
    async login(e, p) { await wait(); if (!e || !p) throw new Error('Invalid login credentials'); logged = true; },
    async logout() { logged = false; },
    async isAdmin() { return true; },
    async lastSync() { return mem.lastSync || null; },
    async syncNow() {
      await wait();
      mem.lastSync = { futott: new Date().toISOString(), uj: 2, torolt: 0, esemenyek: 21, utkozesek: [], hiba: null, inditotta: 'admin' };
      return { ok: true, uj: 2, torolt: 0, esemenyek: 21, utkozesek: [] };
    },
    async rooms() { return [1,2,3,4,5,6,7].map(i => ({ id: i, nev: 'Terem ' + i, sorrend: i, helyszin: i < 5 ? 'Mikepércsi út 10' : 'Déli sor 29' })); },
    async tenants() { return [...mem.tenants].sort((a, b) => a.nev.localeCompare(b.nev, 'hu')); },
    async bookings(s, e) { await wait(); return mem.bookings.filter(b => new Date(b.kezdes) < e && new Date(b.veg) > s); },
    async addBooking(b) { await wait(); if (overlap(b)) throw conflictErr(); mem.bookings.push({ id: mem.seq++, sorozat_id: null, ...b }); },
    async updateBooking(id, b) { await wait(); if (overlap(b, id)) throw conflictErr(); Object.assign(mem.bookings.find(x => x.id === id), b); },
    async deleteBooking(id) { mem.bookings = mem.bookings.filter(b => b.id !== id); },
    async deleteSeriesFrom(sid, from) { mem.bookings = mem.bookings.filter(b => !(b.sorozat_id === sid && b.kezdes >= from)); },
    async addSeries(p) {
      await wait();
      const sid = mem.sseq++, add = [];
      let d = parseIso(p.p_ervenyes_tol); const end = parseIso(p.p_ervenyes_ig);
      const [h, mi] = p.p_kezdes_ido.split(':').map(Number);
      while (iso(d) <= iso(end)) {
        if (isoDow(d) === p.p_het_napja) {
          const k = bpTime(d.y, d.m, d.d, h, mi);
          const b = { terem_id: p.p_terem_id, berlo_id: p.p_berlo_id, kezdes: k.toISOString(),
            veg: new Date(k.getTime() + p.p_hossz_perc * 60000).toISOString(), sorozat_id: sid, megjegyzes: p.p_megjegyzes };
          if (overlap(b) || add.some(o => o.terem_id === b.terem_id && o.kezdes < b.veg && o.veg > b.kezdes))
            throw new Error(`Ütközés: Terem ${b.terem_id} már foglalt ekkor: ${iso(d).replace(/-/g, '.')}. ${p.p_kezdes_ido}`);
          add.push(b);
        }
        d = addDays(d, 1);
      }
      add.forEach(b => mem.bookings.push({ id: mem.seq++, ...b }));
      return sid;
    },
    async saveTenant(id, t) {
      await wait();
      if (id) { const x = mem.tenants.find(z => z.id === id); Object.assign(x, t); return x; }
      const x = { id: 100 + mem.tenants.length, ...t }; mem.tenants.push(x); return x;
    },
  };
}

/* ---------- Auth ---------- */
async function boot() {
  const s = await api.session();
  if (!s) return showLogin();
  try {
    if (!(await api.isAdmin())) {
      await api.logout();
      return showLogin('Ehhez a fiókhoz nincs admin jog.');
    }
  } catch (e) { return showLogin(friendlyError(e)); }
  showApp();
}

}
async function showApp() {

    [rooms, tenants] = await Promise.all([api.rooms(), api.tenants()]);
  } catch (e) { toast(friendlyError(e), true); }

  renderRoomChips();

/* ---------- Calendar ---------- */
const wdFmt = new Intl.DateTimeFormat('hu-HU', { timeZone: TZ, weekday: 'short' });
const monthDayFmt = new Intl.DateTimeFormat('hu-HU', { timeZone: TZ, month: 'long', day: 'numeric' });
const monthDayShortFmt = new Intl.DateTimeFormat('hu-HU', { timeZone: TZ, month: 'short', day: 'numeric' });
const dayShortFmt = new Intl.DateTimeFormat('hu-HU', { timeZone: TZ, month: 'short', day: 'numeric', weekday: 'short' });
const weekStart = d => addDays(d, 1 - isoDow(d));
const sameDay = (a, b) => a.y === b.y && a.m === b.m && a.d === b.d;
const noon = d => new Date(bpTime(d.y, d.m, d.d).getTime() + 12 * 3600000);
const dayBounds = d => { const n = addDays(d, 1); return [bpTime(d.y, d.m, d.d), bpTime(n.y, n.m, n.d)]; };

function renderRoomChips() {
  const nav = $('rooms');
  nav.innerHTML = '';
  let chips = null;
  rooms.forEach((r, i) => {
    if (i === 0 || r.helyszin !== rooms[i - 1].helyszin) {
      const g = document.createElement('div'); g.className = 'rgroup';
      const l = document.createElement('span'); l.className = 'rlabel';
      l.textContent = r.helyszin ? 'Termek: ' + r.helyszin : 'Termek';
      chips = document.createElement('div'); chips.className = 'rchips';
      g.append(l, chips); nav.appendChild(g);
    }
    const b = document.createElement('button');
    b.textContent = mobile.matches ? (r.nev.replace(/^Terem\s*/i, '') || r.nev) : r.nev;
    b.setAttribute('aria-label', r.nev + (r.helyszin ? ', ' + r.helyszin : ''));
    b.setAttribute('aria-pressed', String(r.id === selectedRoom));
    b.onclick = () => { selectedRoom = r.id; renderRoomChips(); refresh(); };
    chips.appendChild(b);
  });
}

function setView(v) {
  view = v;
  $('vDay').setAttribute('aria-pressed', String(v === 'day'));
  $('vWeek').setAttribute('aria-pressed', String(v === 'week'));
  $('prev').setAttribute('aria-label', v === 'day' ? 'Előző nap' : 'Előző hét');
  $('next').setAttribute('aria-label', v === 'day' ? 'Következő nap' : 'Következő hét');
  refresh();
}
$('vDay').onclick = () => setView('day');
$('vWeek').onclick = () => setView('week');

function weekTitle(ws) {
  const we = addDays(ws, 6);
  const f = mobile.matches ? monthDayShortFmt : monthDayFmt;
  const first = f.format(noon(ws)).replace(/\.$/, '');
  if (ws.m === we.m) return `${first}–${we.d}.`;
  return `${first} – ${f.format(noon(we))}`;
}

/* local-clock minutes of t within the local day [ds, de), clamped */
function minutesIn(t, ds, de) {
  if (t <= ds) return 0;
  if (t >= de) return 1440;
  const p = bpParts(t);
  return p.h * 60 + p.min;
}

let reqId = 0;
async function refresh() {
  const my = ++reqId;
  document.body.classList.toggle('show-rooms', view === 'week' || mobile.matches);
  let start, end, cols, groups;
  const tday = todayBp();
  if (view === 'day') {
    [start, end] = dayBounds(day);
    $('title').textContent = (mobile.matches ? dayShortFmt : titleFmt).format(noon(day));
    const visible = mobile.matches ? rooms.filter(r => r.id === selectedRoom) : rooms;
    cols = visible.map((r, i) => ({
      label: r.nev, title: r.nev + (r.helyszin ? ', ' + r.helyszin : ''),
      locStart: i > 0 && r.helyszin !== visible[i - 1].helyszin,
      roomId: r.id, d: day, today: sameDay(day, tday),
    }));
    groups = [];
    visible.forEach((r, i) => {
      if (i > 0 && r.helyszin === visible[i - 1].helyszin) groups[groups.length - 1].span++;
      else groups.push({ label: r.helyszin, span: 1 });
    });
  } else {
    const ws = weekStart(day);
    start = dayBounds(ws)[0];
    end = dayBounds(addDays(ws, 6))[1];
    $('title').textContent = weekTitle(ws);
    const room = rooms.find(r => r.id === selectedRoom) || rooms[0];
    cols = [];
    for (let k = 0; k < 7; k++) {
      const d = addDays(ws, k);
      const wd = wdFmt.format(noon(d)).replace('.', '');
      cols.push({
        label: `${wd.charAt(0).toUpperCase() + wd.slice(1)} ${d.d}.`,
        title: titleFmt.format(noon(d)) + ' – megnyitás napi nézetben',
        onHead: () => { day = d; setView('day'); },
        roomId: room.id, d, today: sameDay(d, tday),
      });
    }
    groups = [{ label: room.nev + (room.helyszin ? ', ' + room.helyszin : ''), span: 7 }];
  }
  $('pick').value = iso(day);
  let list;
  try { list = await api.bookings(start, end); }
  catch (e) { if (my !== reqId) return; toast(friendlyError(e), true); list = []; }
  if (my !== reqId) return;
  bookings = list;
  cols.forEach(c => {
    [c.ds, c.de] = dayBounds(c.d);
    c.bookings = bookings.filter(b => b.terem_id === c.roomId && new Date(b.veg) > c.ds && new Date(b.kezdes) < c.de);
  });
  build(cols, groups);
}

function build(cols, groups) {
  const grid = $('grid');
  grid.classList.toggle('week', view === 'week');
  grid.style.setProperty('--cols', cols.length);
  grid.innerHTML = '';
  const row = rowPx();
  const slots = 48;

  const hasGroups = groups.some(g => g.label);
  grid.style.setProperty('--gh', hasGroups ? '28px' : '0px');
  if (hasGroups) {
    const gc = document.createElement('div'); gc.className = 'grouphead corner'; grid.appendChild(gc);
    groups.forEach(g => {
      const el = document.createElement('div');
      el.className = 'grouphead';
      el.style.gridColumn = 'span ' + g.span;
      el.textContent = g.label || '';
      grid.appendChild(el);
    });
  }
  const corner = document.createElement('div'); corner.className = 'colhead corner'; grid.appendChild(corner);
  cols.forEach(c => {
    const h = document.createElement(c.onHead ? 'button' : 'div');
    h.className = 'colhead' + (c.locStart ? ' loc-start' : '') + (c.today && view === 'week' ? ' today' : '');
    h.textContent = c.label;
    if (c.title) h.title = c.title;
    if (c.onHead) { h.type = 'button'; h.onclick = c.onHead; }
    grid.appendChild(h);
  });
  grid.style.setProperty('--hh', grid.querySelector('.colhead:not(.corner)').offsetHeight + 'px');

  const times = document.createElement('div'); times.className = 'times';
  for (let i = 0; i < slots; i++) {
    const t = document.createElement('div');
    t.textContent = i === 0 ? '' : hm(i * 30);
    if (i % 2) t.className = 'half';
    times.appendChild(t);
  }
  grid.appendChild(times);

  const now = new Date();
  cols.forEach(c => {
    const col = document.createElement('div');
    col.className = 'col' + (c.locStart ? ' loc-start' : '');
    col.style.height = (slots * row) + 'px';
    const ghost = document.createElement('div'); ghost.className = 'ghost'; ghost.hidden = true; col.appendChild(ghost);
    const slotAt = e => Math.max(0, Math.min(slots - 1, Math.floor(e.offsetY / row)));
    col.addEventListener('mousemove', e => {
      if (e.target !== col) { ghost.hidden = true; return; }
      const slot = slotAt(e);
      ghost.hidden = false; ghost.style.top = (slot * row + 1) + 'px';
      ghost.textContent = hm(slot * 30);
    });
    col.addEventListener('mouseleave', () => { ghost.hidden = true; });
    col.addEventListener('click', e => {
      if (e.target !== col && e.target !== ghost) return;
      openBooking(null, { terem_id: c.roomId, day: c.d, startMin: slotAt(e) * 30 });
    });

    c.bookings.forEach(b => {
      const k = new Date(b.kezdes), v = new Date(b.veg);
      const s = minutesIn(k, c.ds, c.de);
      const e = minutesIn(v, c.ds, c.de);
      if (e <= s) return;
      const t = tenantById(b.berlo_id);
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'b ' + (t && t.nyilvanos ? 'pub' : 'priv') + (b.sorozat_id ? ' series' : '') + (b.forras === 'gcal-maszk' ? ' gcal' : '');
      if (e - s <= 30) el.classList.add('short');
      if (e - s < 30) el.classList.add('tiny');
      el.style.top = (s / 30 * row + 1) + 'px';
      el.style.height = ((e - s) / 30 * row - 2) + 'px';
      const range = (s === 0 && e === 1440) ? 'Egész nap' : hmFmt.format(k) + '–' + hmFmt.format(v);
      el.innerHTML = '<div class="lbl"><strong></strong><span></span></div>';
      el.querySelector('strong').textContent = t ? t.nev : 'Bérlő nélkül';
      el.querySelector('span').textContent = range;
      el.title = (t ? t.nev : 'Bérlő nélkül') + ', ' + range + (b.megjegyzes ? '\n' + b.megjegyzes : '');
      el.onclick = ev => { ev.stopPropagation(); openBooking(b); };
      col.appendChild(el);
    });
    if (now >= c.ds && now < c.de) {
      const line = document.createElement('div'); line.className = 'nowline';
      const p = bpParts(now);
      line.style.top = ((p.h * 60 + p.min) / 30 * row - 1) + 'px';
      col.appendChild(line);
    }
    grid.appendChild(col);
  });

  if (!scrolled) {
    scrolled = true;
    const p = bpParts(now);
    const target = sameDay(day, todayBp()) ? p.h * 60 + p.min - 60 : 7 * 60;
    $('scroller').scrollTop = Math.max(0, target / 30 * row);
  }
}

function go(n) { day = addDays(day, view === 'day' ? n : 7 * n); refresh(); }
$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
$('today').onclick = () => { day = todayBp(); scrolled = false; refresh(); };
$('pick').onchange = e => { if (e.target.value) { day = parseIso(e.target.value); refresh(); } };
mobile.addEventListener('change', () => { renderRoomChips(); refresh(); });

/* ---------- Static selects ---------- */
function fillStatic() {
  $('bRoom').innerHTML = rooms.map(r => `<option value="${r.id}">${r.nev}</option>`).join('');
  let s = ''; for (let m = 0; m < 1440; m += 15) s += `<option value="${m}">${hm(m)}</option>`;
  $('bStart').innerHTML = s;
  let d = ''; for (let m = 15; m <= 720; m += 15) d += `<option value="${m}">${durLabel(m)}</option>`;
  $('bDur').innerHTML = d;
  fillTenantSelect();
}
function fillTenantSelect(selected) {
  const sel = $('bTenant');

    tenants.map(t => `<option value="${t.id}"></option>`).join('');

/* ---------- Booking dialog ---------- */
function openBooking(b, preset) {
  editing = b;
  $('bErr').textContent = '';
  $('bRepeat').checked = false; $('bRepeatBox').hidden = true;
  if (b) {
    const s = bpParts(new Date(b.kezdes));
    $('bTitle').textContent = 'Foglalás szerkesztése';
    $('bRoom').value = b.terem_id;
    $('bDate').value = iso(s);
    $('bStart').value = s.h * 60 + s.min;
    $('bDur').value = Math.round((new Date(b.veg) - new Date(b.kezdes)) / 60000);
    fillTenantSelect(b.berlo_id || '');
    $('bNote').value = b.megjegyzes || '';
    $('bRepeatWrap').hidden = true;
    $('bDelWrap').hidden = false;
    $('bDelSeries').hidden = !b.sorozat_id;
    $('bDelOne').textContent = b.sorozat_id ? 'Csak ezt törlöm' : 'Törlés';
    $('bMeta').hidden = !b.sorozat_id && b.forras !== 'gcal-maszk';
    $('bMeta').textContent = b.forras === 'gcal-maszk'
      ? 'Ez a Maszk Google-naptárából jött. Ha itt módosítod vagy törlöd, a következő szinkron visszaállíthatja – a változást inkább a Google-naptárban kérd.'
      : (b.sorozat_id ? 'Ez egy ismétlődő sorozat egyik alkalma. A módosítás csak erre az alkalomra vonatkozik.' : '');
  } else {
    $('bTitle').textContent = 'Új foglalás';
    $('bRoom').value = preset.terem_id;
    $('bDate').value = iso(preset.day);
    $('bStart').value = preset.startMin;
    $('bDur').value = 60;
    fillTenantSelect('');
    $('bNote').value = '';
    $('bRepeatWrap').hidden = false;
    $('bDelWrap').hidden = true;
    $('bMeta').hidden = true;
    $('bUntil').value = iso(addDays(preset.day, 7 * 12));
  }
  updateRepeatInfo();
  $('bDlg').showModal();
}
function updateRepeatInfo() {
  if (!$('bDate').value || !$('bUntil').value) { $('bRepeatInfo').textContent = ''; return; }
  const d = parseIso($('bDate').value), u = parseIso($('bUntil').value);
  const n = Math.floor((Date.UTC(u.y, u.m, u.d) - Date.UTC(d.y, d.m, d.d)) / (7 * 86400000)) + 1;
  $('bRepeatInfo').textContent = n > 0
    ? `Minden ${DOW[isoDow(d)]}, ${hm(+$('bStart').value)}-tól, összesen ${n} alkalom.`
    : 'Az utolsó alkalom nem lehet a kezdőnap előtt.';
}
['bDate', 'bUntil', 'bStart'].forEach(id => $(id).addEventListener('change', updateRepeatInfo));
$('bRepeat').onchange = () => { $('bRepeatBox').hidden = !$('bRepeat').checked; updateRepeatInfo(); };
$('bCancel').onclick = () => $('bDlg').close();

$('bForm').onsubmit = async e => {
  e.preventDefault();
  $('bErr').textContent = '';
  if (!$('bDate').value) { $('bErr').textContent = 'Adj meg egy napot.'; return; }
  const d = parseIso($('bDate').value);
  const startMin = +$('bStart').value, dur = +$('bDur').value;
  const kezdes = bpTime(d.y, d.m, d.d, Math.floor(startMin / 60), startMin % 60);
  const veg = new Date(kezdes.getTime() + dur * 60000);
  const rec = {
    terem_id: +$('bRoom').value,
    berlo_id: $('bTenant').value ? +$('bTenant').value : null,
    kezdes: kezdes.toISOString(), veg: veg.toISOString(),
    megjegyzes: $('bNote').value.trim() || null,
  };
  $('bSave').disabled = true;
  try {
    if (editing) {
      await api.updateBooking(editing.id, rec);
      toast('Foglalás mentve');
    } else if ($('bRepeat').checked) {
      if (!$('bUntil').value || $('bUntil').value < $('bDate').value) {
        $('bErr').textContent = 'Az utolsó alkalom nem lehet a kezdőnap előtt.'; return;
      }
      await api.addSeries({
        p_terem_id: rec.terem_id, p_berlo_id: rec.berlo_id, p_het_napja: isoDow(d),
        p_kezdes_ido: hm(startMin), p_hossz_perc: dur,
        p_ervenyes_tol: $('bDate').value, p_ervenyes_ig: $('bUntil').value, p_megjegyzes: rec.megjegyzes,
      });
      toast('Sorozat mentve');
    } else {
      await api.addBooking(rec);
      toast('Foglalás mentve');
    }
    $('bDlg').close();
    day = d;
    if ((view === 'week' || mobile.matches) && rec.terem_id !== selectedRoom) { selectedRoom = rec.terem_id; renderRoomChips(); }
    refresh();
  } catch (err) {
    $('bErr').textContent = friendlyError(err);
  } finally {
    $('bSave').disabled = false;
  }
};

$('bDelOne').onclick = async () => {
  if (!editing) return;
  if (!confirm('Biztosan törlöd ezt a foglalást?')) return;
  try { await api.deleteBooking(editing.id); $('bDlg').close(); toast('Foglalás törölve'); refresh(); }
  catch (err) { $('bErr').textContent = friendlyError(err); }
};
$('bDelSeries').onclick = async () => {
  if (!editing || !editing.sorozat_id) return;
  const when = shortDateFmt.format(new Date(editing.kezdes));
  if (!confirm(`Törlöd ezt (${when}) és a sorozat összes későbbi alkalmát? A korábbi alkalmak megmaradnak.`)) return;
  try { await api.deleteSeriesFrom(editing.sorozat_id, editing.kezdes); $('bDlg').close(); toast('Sorozat törölve ettől a naptól'); refresh(); }
  catch (err) { $('bErr').textContent = friendlyError(err); }
};

$('bNewTenant').onclick = e => {
  e.preventDefault();
  tenantReturnToBooking = true;
  openTenant(null);
};

/* ---------- Tenants ---------- */
function renderTenants() {
  const q = $('tenSearch').value.trim().toLowerCase();
  const list = tenants.filter(t => !q || t.nev.toLowerCase().includes(q) || (t.megjeleno_nev || '').toLowerCase().includes(q));
  const body = $('tenRows');
  body.innerHTML = '';
  if (!list.length) {
    body.innerHTML = `<tr><td colspan="3" class="empty">${tenants.length ? 'Nincs találat.' : 'Vedd fel az első bérlőt az Új bérlő gombbal.'}</td></tr>`;
    return;
  }
  list.forEach(t => {
    const tr = document.createElement('tr');
    tr.tabIndex = 0;
    tr.innerHTML = '<td></td><td></td><td></td>';
    tr.children[0].textContent = t.nev;
    const pill = document.createElement('span');
    pill.className = 'pill' + (t.nyilvanos ? ' on' : '');
    pill.textContent = t.nyilvanos ? (t.megjeleno_nev || t.nev) + (t.link ? ' + link' : '') : 'Foglalt';
    tr.children[1].appendChild(pill);
    tr.children[2].textContent = t.elerhetoseg || '';
    tr.onclick = () => { tenantReturnToBooking = false; openTenant(t); };
    tr.onkeydown = e => { if (e.key === 'Enter') tr.onclick(); };
    body.appendChild(tr);
  });
}
$('tenSearch').oninput = renderTenants;
$('newTenant').onclick = () => { tenantReturnToBooking = false; openTenant(null); };

function openTenant(t) {
  tenantEditing = t ? t.id : null;
  $('tTitle').textContent = t ? 'Bérlő szerkesztése' : 'Új bérlő';
  $('tName').value = t ? t.nev : '';
  $('tPublic').checked = t ? t.nyilvanos : false;
  $('tDisplay').value = t ? (t.megjeleno_nev || '') : '';
  $('tLink').value = t ? (t.link || '') : '';
  $('tContact').value = t ? (t.elerhetoseg || '') : '';
  $('tNote').value = t ? (t.megjegyzes || '') : '';
  $('tErr').textContent = '';
  $('tPubBox').hidden = !$('tPublic').checked;
  $('tDlg').showModal();
  $('tName').focus();
}
$('tPublic').onchange = () => { $('tPubBox').hidden = !$('tPublic').checked; };
$('tCancel').onclick = () => $('tDlg').close();
$('tForm').onsubmit = async e => {
  e.preventDefault();
  $('tErr').textContent = '';
  const name = $('tName').value.trim();
  if (!name) { $('tErr').textContent = 'Adj meg egy nevet.'; return; }
  let link = $('tLink').value.trim() || null;
  if (link && !/^https?:\/\//i.test(link)) link = 'https://' + link;
  const rec = {
    nev: name,
    nyilvanos: $('tPublic').checked,
    megjeleno_nev: $('tDisplay').value.trim() || null,
    link,
    elerhetoseg: $('tContact').value.trim() || null,
    megjegyzes: $('tNote').value.trim() || null,
  };
  try {
    const saved = await api.saveTenant(tenantEditing, rec);
    tenants = await api.tenants();
    $('tDlg').close();
    toast('Bérlő mentve');
    renderTenants();
    if (tenantReturnToBooking) fillTenantSelect(saved.id);
    else fillTenantSelect();
    refresh();
  } catch (err) { $('tErr').textContent = friendlyError(err); }
};

/* ---------- Start ---------- */
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('appView').hidden && !$('bDlg').open) refresh(); });
setInterval(() => { if (!document.hidden && !$('appView').hidden && !$('bDlg').open && !$('tDlg').open) refresh(); }, 60000);
/* ---------- Google-szinkron ---------- */
const syncFmt = new Intl.DateTimeFormat('hu-HU', { timeZone: TZ, month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
async function showSync() {
  const info = $('syncInfo');
  try {
    const n = await api.lastSync();
    info.innerHTML = '';
    const lead = document.createElement('span');
    lead.textContent = 'Maszk Google-naptár: ';
    info.appendChild(lead);
    const st = document.createElement('strong');
    if (!n) {
      st.textContent = 'még nem volt szinkron';
    } else if (n.hiba) {
      st.className = 'warn';
      st.textContent = 'hiba ' + syncFmt.format(new Date(n.futott)) + ' – ' + n.hiba;
    } else {
      const utk = Array.isArray(n.utkozesek) ? n.utkozesek.length : 0;
      st.textContent = 'utoljára ' + syncFmt.format(new Date(n.futott)) +
        ` (${n.uj} új, ${n.torolt} törölt` + (utk ? `, ${utk} ütközés miatt kimaradt` : '') + ')';
      if (utk) {
        st.className = 'warn';
        st.title = n.utkozesek.map(u => `${u.berlo}: ${syncFmt.format(new Date(u.kezdes))}–${hmFmt.format(new Date(u.veg))}`).join('\n');
      }
    }
    info.appendChild(st);
  } catch (e) {
    info.textContent = 'Maszk Google-naptár: a szinkron még nincs beállítva.';
  }
}
$('syncNow').onclick = async () => {
  const btn = $('syncNow');
  btn.disabled = true; const label = btn.textContent; btn.textContent = 'Szinkronizálás…';
  try {
    const r = await api.syncNow();
    const utk = (r.utkozesek || []).length;
    toast(`Szinkron kész: ${r.uj} új, ${r.torolt} törölt` + (utk ? `, ${utk} ütközés` : ''), utk > 0);
    refresh();
  } catch (e) {
    toast(friendlyError(e), true);
  } finally {
    btn.disabled = false; btn.textContent = label;
    showSync();
  }
};

boot();
</script>
</body>
</html>
